[package]
name = "resguardo-motor"
version = "0.1.0"
description = "Motor de copias de Resguardo: restic, planes, retención y tamaños"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Aún no se publica en crates.io (deja que cargo-deny acepte las dependencias de ruta).
publish = false

[features]
# Utilidades de prueba (repositorio real de pruebas, rutas de snapshot) para
# las pruebas de otros crates del espacio de trabajo.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rcgen = "0.13"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Wdk_System_Threading",
] }

[dev-dependencies]
# Pruebas de propiedades (docs/plataforma.md, §7.3).
proptest = { version = "1", default-features = false, features = ["std"] }
