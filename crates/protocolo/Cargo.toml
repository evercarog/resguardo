[package]
name = "resguardo-protocolo"
version = "0.1.0"
description = "Protocolo de Resguardo: sobres sellados, mensajes firmados, códigos de emparejamiento y vectores de prueba"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Aún no se publica en crates.io (deja que cargo-deny acepte las dependencias de ruta).
publish = false

[dependencies]
argon2 = "0.5"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crypto_secretbox = "0.1"
chacha20poly1305 = "0.10"
unicode-normalization = "0.1"
crypto_box = { version = "0.9.1", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Pruebas de propiedades (docs/plataforma.md, §7.3).
proptest = { version = "1", default-features = false, features = ["std"] }
