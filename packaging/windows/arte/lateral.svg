<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- Imagen lateral de las páginas de bienvenida y final de los instaladores
       (MUI_WELCOMEFINISHPAGE_BITMAP, 164×314). Clara, para que el texto de la
       derecha se lea bien; el escudo de assets/logo.svg y un fondo discreto.
       scripts/arte-instaladores.mjs la convierte en lateral.bmp y lateral@2x.bmp. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f5f2"/>
      <stop offset="0.62" stop-color="#f6fbfa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19a58e"/>
      <stop offset="1" stop-color="#0a5d52"/>
    </linearGradient>
    <pattern id="puntos" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="0.8" fill="#0f766e" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="hacia-abajo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#000000"/>
    </linearGradient>
    <mask id="desvanecer">
      <rect width="164" height="314" fill="url(#hacia-abajo)"/>
    </mask>
    <path id="escudo" d="M32 11.5 16.5 17v13.2c0 10.1 6.5 18.9 15.5 22.3 9-3.4 15.5-12.2 15.5-22.3V17L32 11.5Z"/>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0a5d52" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="164" height="314" fill="url(#fondo)"/>
  <rect width="164" height="314" fill="url(#puntos)" mask="url(#desvanecer)"/>

  <!-- Escudos concéntricos, muy tenues, alrededor del logotipo. -->
  <g fill="none" stroke="#0f766e" stroke-linejoin="round">
    <use href="#escudo" transform="translate(82 118) scale(2.7) translate(-32 -32)" stroke-width="0.45" stroke-opacity="0.13"/>
    <use href="#escudo" transform="translate(82 118) scale(3.7) translate(-32 -32)" stroke-width="0.33" stroke-opacity="0.09"/>
    <use href="#escudo" transform="translate(82 118) scale(4.8) translate(-32 -32)" stroke-width="0.26" stroke-opacity="0.06"/>
  </g>

  <!-- El logotipo (assets/logo.svg) a 72 px. -->
  <g transform="translate(46 82) scale(1.125)" filter="url(#sombra)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#marca)"/>
    <use href="#escudo" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M38.8 27.4a7.6 7.6 0 1 1-2.3-4.6" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M37.6 18.8v5h-5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Una franja de la marca abajo y el borde con el texto de la derecha. -->
  <rect y="310" width="164" height="4" fill="url(#marca)"/>
  <rect x="163" width="1" height="314" fill="#d6e8e4"/>
</svg>
