# fail2ban: accesos fallidos a Resguardo Server (contraseña, código TOTP o de
# recuperación, código de primer arranque, invitación, secreto o código de un
# equipo). El servidor escribe una línea por cada uno en su registro (journald):
#
#   Acceso fallido desde 203.0.113.5: entrar (POST /api/sesion)
#
# Detrás de un proxy (--detras-de-proxy) la IP es la del cliente, no la del
# proxy. Las líneas «Límite de intentos superado» no cuentan aquí: el propio
# servidor ya frena esas IP y las puede provocar alguien legítimo.
#
# Instalación: packaging/linux/nube/preparar-vm.sh (o cópialo a /etc/fail2ban/filter.d/).
# Prueba: sudo fail2ban-regex systemd-journal resguardo-server

[Definition]
failregex = ^.*Acceso fallido desde <HOST>: \S+
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=resguardo-server.service
