# fail2ban: bloquea durante una hora la IP que falla 10 accesos a Resguardo
# Server en 10 minutos (en los puertos 80 y 443; el servidor ya limita además
# los intentos por cuenta, por IP y por código). Ver filter.d/resguardo-server.conf.
#
# Ojo con las oficinas tras una sola IP: si alguien se equivoca mucho, bloquea a
# toda la oficina una hora. Sube maxretry o añade su IP a ignoreip si hace falta.

[resguardo-server]
enabled  = true
backend  = systemd
filter   = resguardo-server
port     = http,https
maxretry = 10
findtime = 10m
bantime  = 1h
